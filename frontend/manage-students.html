<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Students — Drishti</title>
  <meta name="description" content="Manage registered students — view, edit, or remove student records." />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- Ambient Glows -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-right"></div>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.15"/><circle cx="16" cy="12" r="5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 26c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="16" cy="12" r="2" fill="currentColor"/></svg>
      Drishti
    </a>
    <div class="nav-links" id="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="manage-students.html" class="active">Students</a>
      <a href="view-attendance.html">Attendance</a>
      <a href="#" data-action="logout">Logout</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>


  <!-- ═══════════ PAGE CONTENT ═══════════ -->
  <div class="page-wrapper">
    <div class="page-content">
      <div class="container">

        <!-- Header -->
        <div class="flex-between fade-in-up" style="margin-bottom: 24px;">
          <div class="section-header" style="margin-bottom: 0;">
            <h2>Manage Students</h2>
            <p>View and manage all registered students and their face data.</p>
          </div>
          <a href="register-student.html" class="btn btn-primary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            Add Student
          </a>
        </div>

        <!-- Search & Filter -->
        <div class="filters-row fade-in-up stagger-1">
          <div class="filter-group" style="flex: 2;">
            <label>Search</label>
            <input class="form-input" type="text" id="search-input" 
                   placeholder="Search by name or roll number..." 
                   oninput="debounceSearch()" />
          </div>
          <div class="filter-group">
            <label>Class</label>
            <select class="form-select" id="filter-class" onchange="loadStudents()">
              <option value="">All Classes</option>
              <option value="CSE-A">CSE-A</option>
              <option value="CSE-B">CSE-B</option>
              <option value="CSE-C">CSE-C</option>
              <option value="ECE-A">ECE-A</option>
              <option value="ECE-B">ECE-B</option>
              <option value="ME-A">ME-A</option>
              <option value="CE-A">CE-A</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Department</label>
            <select class="form-select" id="filter-dept" onchange="loadStudents()">
              <option value="">All Departments</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Electronics">Electronics</option>
              <option value="Mechanical">Mechanical</option>
              <option value="Civil">Civil</option>
            </select>
          </div>
        </div>

        <!-- Students Grid -->
        <div id="students-grid" class="fade-in-up stagger-2">
          <!-- Loaded dynamically -->
        </div>

        <!-- Pagination -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 24px;" id="students-pagination">
          <p class="text-muted" style="font-size: 0.85rem;" id="students-info"></p>
          <div style="display: flex; gap: 8px;" id="students-page-btns"></div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="students-empty" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
          <h3>No Students Found</h3>
          <p>No students match your search. Try different filters or <a href="register-student.html">register a new student</a>.</p>
        </div>

      </div>
    </div>
  </div>


  <!-- ═══════════ EDIT MODAL ═══════════ -->
  <div class="modal-overlay" id="edit-student-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Student</h3>
        <button class="modal-close">&times;</button>
      </div>
      <form id="edit-student-form">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label class="form-label" for="edit-name">Full Name</label>
          <input class="form-input" type="text" id="edit-name" required />
        </div>
        <div class="grid-2" style="gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="edit-class">Class</label>
            <input class="form-input" type="text" id="edit-class" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-dept">Department</label>
            <input class="form-input" type="text" id="edit-dept" />
          </div>
        </div>
        <div class="grid-2" style="gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="edit-email">Email</label>
            <input class="form-input" type="email" id="edit-email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-phone">Phone</label>
            <input class="form-input" type="tel" id="edit-phone" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('edit-student-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-save-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>


  <script src="scripts/api.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    if (!requireAuth()) { /* redirect */ }

    let studentsPage = 1;
    const studentsLimit = 20;
    let searchTimer;

    loadStudents();

    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadStudents(), 400);
    }

    async function loadStudents(page = 1) {
      studentsPage = page;
      const grid = document.getElementById('students-grid');
      const empty = document.getElementById('students-empty');
      const pagination = document.getElementById('students-pagination');

      grid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
          <div class="spinner" style="margin: 0 auto;"></div>
          <p class="text-muted" style="margin-top: 12px; font-size: 0.85rem;">Loading students...</p>
        </div>
      `;

      const filters = {
        search: document.getElementById('search-input').value.trim() || undefined,
        class: document.getElementById('filter-class').value || undefined,
        department: document.getElementById('filter-dept').value || undefined,
      };

      try {
        const data = await StudentAPI.list(page, studentsLimit, filters);
        const items = data.items || [];
        const total = data.total || 0;

        if (items.length === 0) {
          grid.innerHTML = '';
          grid.style.display = 'none';
          empty.style.display = 'block';
          pagination.style.display = 'none';
          return;
        }

        grid.style.display = 'block';
        empty.style.display = 'none';
        pagination.style.display = 'flex';

        // Group students by class
        const grouped = {};
        items.forEach(student => {
          const cls = student.class_ || 'Unassigned';
          if (!grouped[cls]) grouped[cls] = [];
          grouped[cls].push(student);
        });

        let html = '';
        const sortedClasses = Object.keys(grouped).sort();

        for (const cls of sortedClasses) {
          html += `
            <div class="group-section" style="background: rgba(152,126,93,0.06); border: 1px solid rgba(152,126,93,0.15); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 40px; box-shadow: 0 4px 16px rgba(152,126,93,0.04);">
              <div class="group-header" style="background: linear-gradient(90deg, rgba(152,126,93,0.12) 0%, transparent 100%); border-left: 4px solid var(--chamoisee); padding: 16px 20px; border-radius: 6px; margin-top: 0; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.15rem; color: var(--chamoisee);">🎓 Class: ${cls}</h3>
                <span style="font-weight: 600; font-size: 0.9rem; color: var(--chamoisee);">${grouped[cls].length} student${grouped[cls].length !== 1 ? 's' : ''}</span>
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;">
          `;

          html += grouped[cls].map(student => {
            const initials = getInitials(student.name);
            const hasImage = student.images && student.images.length > 0;
            return `
              <div class="student-card" id="student-${student.id}">
                <div class="student-avatar">
                  ${hasImage 
                    ? `<img src="${student.images[0].image_path}" alt="${student.name}" onerror="this.parentElement.innerHTML='${initials}'" />`
                    : initials
                  }
                </div>
                <div class="student-info">
                  <div class="student-name">${student.name}</div>
                  <div class="student-roll">${student.roll_number} · ${student.class_ || ''}${student.department ? ' · ' + student.department : ''}</div>
                </div>
                <div class="student-actions">
                  <button class="btn btn-ghost btn-icon btn-sm" title="Edit" onclick='editStudent(${JSON.stringify(student).replace(/'/g, "&#39;")})'>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                  </button>
                  <button class="btn btn-ghost btn-icon btn-sm" title="Delete" style="color: var(--danger);" onclick="deleteStudent('${student.id}', '${student.name}')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                  </button>
                </div>
              </div>
            `;
          }).join('');

          html += `
              </div>
            </div>
          `;
        }

        grid.innerHTML = html;

        // Pagination
        const totalPages = Math.ceil(total / studentsLimit);
        document.getElementById('students-info').textContent = `Showing ${(page-1)*studentsLimit + 1}–${Math.min(page*studentsLimit, total)} of ${total} students`;

        const btns = document.getElementById('students-page-btns');
        btns.innerHTML = '';
        if (page > 1) btns.innerHTML += `<button class="btn btn-ghost btn-sm" onclick="loadStudents(${page-1})">← Prev</button>`;
        if (page < totalPages) btns.innerHTML += `<button class="btn btn-ghost btn-sm" onclick="loadStudents(${page+1})">Next →</button>`;

      } catch (err) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--danger);">Failed to load students: ${err.message}</div>`;
      }
    }

    function editStudent(student) {
      document.getElementById('edit-id').value = student.id;
      document.getElementById('edit-name').value = student.name;
      document.getElementById('edit-class').value = student.class_ || '';
      document.getElementById('edit-dept').value = student.department || '';
      document.getElementById('edit-email').value = student.email || '';
      document.getElementById('edit-phone').value = student.phone || '';
      openModal('edit-student-modal');
    }

    document.getElementById('edit-student-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('edit-save-btn');
      const id = document.getElementById('edit-id').value;

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        await StudentAPI.update(id, {
          name: document.getElementById('edit-name').value.trim(),
          class_name: document.getElementById('edit-class').value.trim(),
          department: document.getElementById('edit-dept').value.trim() || null,
          email: document.getElementById('edit-email').value.trim() || null,
          phone: document.getElementById('edit-phone').value.trim() || null,
        });
        closeModal('edit-student-modal');
        showToast('Student updated successfully!', 'success');
        loadStudents(studentsPage);
      } catch (err) {
        showToast(err.message || 'Update failed', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Save Changes';
    });

    function deleteStudent(id, name) {
      confirmAction(`Deactivate student "${name}"? This will hide them from attendance.`, async () => {
        try {
          await StudentAPI.delete(id);
          showToast('Student deactivated', 'success');
          loadStudents(studentsPage);
        } catch (err) {
          showToast(err.message || 'Delete failed', 'error');
        }
      });
    }
  </script>
</body>
</html>
