<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Drishti</title>
  <meta name="description" content="Login to Drishti Face Attendance System to manage classroom attendance." />
  <link rel="stylesheet" href="styles/main.css" />
</head>

<body>
  <!-- Ambient Glows -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-right"></div>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand" id="nav-brand">
      <svg viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.15" />
        <circle cx="16" cy="12" r="5" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M8 26c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" />
        <circle cx="16" cy="12" r="2" fill="currentColor" />
      </svg>
      Drishti
    </a>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="active">Login</a>
      <a href="signup.html">Sign Up</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>


  <!-- ═══════════ LOGIN FORM ═══════════ -->
  <div class="auth-layout">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" type="email" id="login-email" name="email" placeholder="you@example.com" required
            autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" name="password"
            placeholder="Enter your password" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>


  <script src="scripts/api.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfAuth();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const data = await AuthAPI.login(email, password);
        // Save user info if returned
        if (data.user) setUser(data.user);
        showToast('Login successful!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      } catch (err) {
        showToast(err.message || 'Login failed. Please check your credentials.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>

</html>
